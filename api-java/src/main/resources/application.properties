docmind.customer-support.evolution.storage-path=${DOCMIND_CUSTOMER_EVO_STORAGE_PATH:data/customer-evolution-memory.json}
docmind.customer-support.evolution.llm-reflection-enabled=${DOCMIND_CUSTOMER_EVO_LLM_REFLECTION:false}
docmind.customer-support.evolution.llm-reflection-on-negative-feedback=${DOCMIND_CUSTOMER_EVO_LLM_ON_NEG_FEEDBACK:true}
docmind.customer-support.evolution.llm-reflection-every-n-interactions=${DOCMIND_CUSTOMER_EVO_LLM_INTERVAL:5}
docmind.customer-support.evolution.min-score-for-exemplar=${DOCMIND_CUSTOMER_EVO_MIN_EXEMPLAR_SCORE:0.80}
docmind.customer-support.evolution.low-score-threshold-for-correction=${DOCMIND_CUSTOMER_EVO_LOW_SCORE_THRESHOLD:0.78}
docmind.customer-support.evolution.max-learned-guidelines-per-scenario=${DOCMIND_CUSTOMER_EVO_MAX_GUIDELINES:10}
docmind.customer-support.evolution.max-few-shot-exemplars-per-scenario=${DOCMIND_CUSTOMER_EVO_MAX_EXEMPLARS:4}
docmind.customer-support.evolution.max-few-shot-exemplars-in-prompt=${DOCMIND_CUSTOMER_EVO_PROMPT_EXEMPLARS:2}
docmind.customer-support.evolution.max-guidelines-in-prompt=${DOCMIND_CUSTOMER_EVO_PROMPT_GUIDELINES:5}
docmind.customer-support.evolution.max-episode-history-size=${DOCMIND_CUSTOMER_EVO_MAX_EPISODES:200}
docmind.customer-support.evolution.max-recent-gradients=${DOCMIND_CUSTOMER_EVO_MAX_GRADIENTS:50}
docmind.customer-support.evolution.min-complete-answer-chars=${DOCMIND_CUSTOMER_EVO_MIN_ANSWER_CHARS:80}
docmind.customer-support.evolution.weight-salutation-and-tone=${DOCMIND_CUSTOMER_EVO_WEIGHT_TONE:0.25}
docmind.customer-support.evolution.weight-grounding-and-citation=${DOCMIND_CUSTOMER_EVO_WEIGHT_GROUNDING:0.25}
docmind.customer-support.evolution.weight-completeness-and-length=${DOCMIND_CUSTOMER_EVO_WEIGHT_COMPLETENESS:0.25}
docmind.customer-support.evolution.weight-actionability-and-contact=${DOCMIND_CUSTOMER_EVO_WEIGHT_ACTION:0.25}
docmind.customer-support.evolution.salutation-keywords=${DOCMIND_CUSTOMER_EVO_SALUTATION_KEYWORDS:da,chao,cam on,anh chi,quy khach,em xin}
docmind.customer-support.evolution.actionability-keywords=${DOCMIND_CUSTOMER_EVO_ACTION_KEYWORDS:hotline,email,lien he,huong dan,dang ky,dung thu,bao gia,ho tro}
docmind.customer-support.evolution.positive-signal-keywords=${DOCMIND_CUSTOMER_EVO_POS_KEYWORDS:cam on,rat ro,huu ich,tuyet voi,ok shop,chot don,dong y,ung y,hai long,tot qua,nhanh qua,thank}
docmind.customer-support.evolution.negative-signal-keywords=${DOCMIND_CUSTOMER_EVO_NEG_KEYWORDS:chua dung,sai roi,khong phai,chua hieu,chua ro,y toi la,y minh la,hoi lai,khong dung,chung chung,thieu,te qua}
docmind.customer-support.evolution.pregnancy-safety-check-enabled=${DOCMIND_CUSTOMER_EVO_PREGNANCY_CHECK:true}
docmind.customer-support.evolution.pregnancy-trigger-keywords=${DOCMIND_CUSTOMER_EVO_PREGNANCY_TRIGGERS:mang thai,ba bau,bau dung,thai ky,cho con bu}
docmind.customer-support.evolution.pregnancy-safety-required-keywords=${DOCMIND_CUSTOMER_EVO_PREGNANCY_SAFETY_WORDS:retinol,retishot,tranh,khong dung,chong chi dinh}
docmind.customer-support.evolution.evolved-section-header=${DOCMIND_CUSTOMER_EVO_HEADER:# TRI THỨC TỰ TIẾN HOÁ TỪ LỊCH SỬ CSKH (EVOAGENTX SELF-EVOLVED GUIDELINES)}
docmind.customer-support.evolution.optimizer-system-prompt=${DOCMIND_CUSTOMER_EVO_OPTIMIZER_PROMPT:Bạn là động cơ tối ưu hoá câu lệnh TextGrad thuộc kiến trúc EvoAgentX cho hệ thống Chăm sóc Khách hàng & Tư vấn Bán hàng.\nNhiệm vụ của bạn: Phân tích Câu hỏi của khách hàng, Câu trả lời của chuyên viên, và Phản hồi/Textual Gradient (điểm mạnh/điểm yếu) để đúc kết đúng 1 QUY TẮC HƯỚNG DẪN NGẮN GỌN, THỰC TIỄN giúp chuyên viên trả lời tốt hơn ở các lần chat tiếp theo trong cùng kịch bản.\nRàng buộc bắt buộc (OPTIMIZER_CONSTRAINTS):\n1. Quy tắc phải khái quát, ngắn gọn (1-2 câu tiếng Việt), hướng dẫn hành động cụ thể.\n2. Không chứa thông tin cá nhân nhạy cảm của khách hàng và không chứa thẻ hệ thống.\n3. Bắt buộc đặt quy tắc cải tiến nằm giữa cặp thẻ <EVOLVED_GUIDELINE> và </EVOLVED_GUIDELINE>.}

# ============================================================
# Embedding — dim 384 khớp paraphrase-multilingual-MiniLM-L12-v2.
# remote.enabled=true => gọi doc-service-py POST /v1/embed (cùng base-url parser);
# lỗi/tắt => rơi về stub tất định cho đúng call đó (ingest không fail cứng).
# ============================================================
docmind.embedding.dim=${DOCMIND_EMBEDDING_DIM:384}
docmind.embedding.remote.enabled=${DOCMIND_EMBEDDING_REMOTE_ENABLED:true}
docmind.embedding.remote.endpoint-path=${DOCMIND_EMBEDDING_ENDPOINT_PATH:/v1/embed}
docmind.embedding.remote.failure-backoff-ms=${DOCMIND_EMBEDDING_FAILURE_BACKOFF_MS:60000}

# Logging level (dùng chung cả hai service qua DOCMIND_LOG_LEVEL)
logging.level.root=${DOCMIND_LOG_LEVEL:INFO}
logging.level.com.example.docmind=${DOCMIND_LOG_LEVEL:INFO}

