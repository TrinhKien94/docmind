docmind.customer-support.scenarios.WARRANTY_RETURN.title=Cam kết Chính hãng, Đổi trả & Xử lý Kích ứng Da liễu
docmind.customer-support.scenarios.WARRANTY_RETURN.description=Giải đáp cam kết chính hãng LVMH, chính sách đổi trả 7 ngày, bảo hành 1 đổi 1 lỗi vận chuyển (gãy son, chảy dầu, hỏng vòi xịt) và giao thức xử lý kích ứng da liễu Cosmetovigilance 14 ngày.
docmind.customer-support.scenarios.WARRANTY_RETURN.playbook-instructions=- Khách hàng đang hỏi về CAM KẾT CHÍNH HÃNG, ĐỔI TRẢ, BẢO HÀNH HƯ HỎNG VẬN CHUYỂN (gãy son, đổ mồ hôi, hỏng vòi xịt) hoặc BỊ DỊ ỨNG / KÍCH ỨNG DA LIỄU sau khi sử dụng.\n- Thể hiện sự đồng cảm chân thành, trấn an khách hàng ngay từ câu đầu tiên bằng giọng văn ấm áp và bảo vệ tối đa quyền lợi chính đáng của khách hàng.\n- Chia sẻ rõ ràng, tự nhiên (tuyệt đối KHÔNG kèm trích dẫn [1], [2] hay nhắc tới tài liệu): Đổi ý/đổi màu trong 07 ngày khi còn nguyên seal (hỗ trợ dùng thử ống Sample Try First trước); Bảo hành 1 đổi 1 miễn phí trong 14 ngày với lỗi sản xuất/vận chuyển; và hỗ trợ thu hồi đổi sản phẩm dịu nhẹ hoặc hoàn tiền 100% trong 14 ngày theo giao thức Cosmetovigilance ngay cả khi ĐÃ MỞ NẮP nếu bị kích ứng da liễu (còn >= 80% dung tích).\n- Ân cần hướng dẫn khách hàng cách làm dịu da (nếu bị kích ứng) và thông tin cần gửi (ảnh/video + mã Batch Code) để hỗ trợ ngay trong 24h.
docmind.customer-support.scenarios.WARRANTY_RETURN.default-evolution-guideline=Khi giải đáp bảo hành, đổi trả hoặc kích ứng mỹ phẩm (WARRANTY_RETURN), luôn mở đầu bằng sự đồng cảm, giải thích tự nhiên chính sách đổi trả nguyên seal 7 ngày, bảo hành lỗi vận chuyển 1 đổi 1 trong 14 ngày và giao thức Cosmetovigilance hoàn tiền 100% khi kích ứng da liễu dù đã mở nắp.
