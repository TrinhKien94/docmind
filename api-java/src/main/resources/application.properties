docmind.customer-support.store-name=${DOCMIND_CUSTOMER_STORE_NAME:DocMind Store & Digital Services}
docmind.customer-support.hotline=${DOCMIND_CUSTOMER_HOTLINE:1900-6868}
docmind.customer-support.support-email=${DOCMIND_CUSTOMER_EMAIL:cskh@docmind.vn}
docmind.customer-support.working-hours=${DOCMIND_CUSTOMER_HOURS:08:00 - 22:00 (Thứ 2 - Chủ Nhật)}
docmind.customer-support.assistant-persona=${DOCMIND_CUSTOMER_ASSISTANT_PERSONA:Chuyên viên Tư vấn Bán hàng & Chăm sóc Khách hàng (Sales & Customer Service AI Specialist)}
docmind.customer-support.default-customer-role=${DOCMIND_CUSTOMER_DEFAULT_ROLE:Khách hàng mua hàng hoặc sử dụng dịch vụ}
docmind.customer-support.default-customer-name=${DOCMIND_CUSTOMER_DEFAULT_NAME:Quý khách}
docmind.customer-support.fallback-customer-salutation=${DOCMIND_CUSTOMER_FALLBACK_SALUTATION:Anh/Chị}
docmind.customer-support.customer-role-label=${DOCMIND_CUSTOMER_ROLE_LABEL:Khách hàng}
docmind.customer-support.assistant-role-label=${DOCMIND_CUSTOMER_ASSISTANT_LABEL:Chuyên viên CSKH}
docmind.customer-support.assistant-role-aliases=${DOCMIND_CUSTOMER_ASSISTANT_ALIASES:assistant,agent,support,bot,cskh}
docmind.customer-support.default-top-k=${DOCMIND_CUSTOMER_TOP_K:5}
docmind.customer-support.min-top-k=${DOCMIND_CUSTOMER_MIN_TOP_K:1}
docmind.customer-support.max-top-k=${DOCMIND_CUSTOMER_MAX_TOP_K:50}
docmind.customer-support.snippet-max-length=${DOCMIND_CUSTOMER_SNIPPET_MAX_LENGTH:240}
docmind.customer-support.auto-discover-documents=${DOCMIND_CUSTOMER_AUTO_DISCOVER_DOCS:true}
docmind.customer-support.max-auto-discover-documents=${DOCMIND_CUSTOMER_MAX_AUTO_DOCS:20}
docmind.customer-support.max-history-turns=${DOCMIND_CUSTOMER_MAX_HISTORY_TURNS:10}
docmind.customer-support.max-history-turn-chars=${DOCMIND_CUSTOMER_MAX_HISTORY_TURN_CHARS:1000}
docmind.customer-support.prompt-template-id=${DOCMIND_CUSTOMER_PROMPT_ID:customer-sales-service-v1}
docmind.customer-support.custom-system-prompt=${DOCMIND_CUSTOMER_SYSTEM_PROMPT:}
docmind.customer-support.sample-preview-question=${DOCMIND_CUSTOMER_SAMPLE_PREVIEW_QUESTION:Tư vấn giúp tôi gói dịch vụ phù hợp và chính sách bảo hành khi mua hàng?}
docmind.customer-support.no-document-context-note=${DOCMIND_CUSTOMER_NO_DOC_NOTE:(Chưa có đoạn trích tài liệu cụ thể nào được đính kèm; hãy tư vấn dựa trên <STORE_POLICY_CONTEXT> và kịch bản nghiệp vụ đã huấn luyện.)}
docmind.customer-support.answer-prompt-suffix=${DOCMIND_CUSTOMER_ANSWER_SUFFIX:Trả lời tư vấn cho khách hàng (kèm trích dẫn [n] nếu dùng tài liệu):}
docmind.customer-support.core-rules-template=${DOCMIND_CUSTOMER_CORE_RULES_TEMPLATE:}
docmind.customer-support.default-policy-context=${DOCMIND_CUSTOMER_DEFAULT_POLICY:- Chính sách mua hàng & đặt hàng: Hỗ trợ đặt hàng trực tuyến 24/7, xác nhận đơn tự động qua SMS/Email, tư vấn chọn sản phẩm và gói dịch vụ theo nhu cầu thực tế.\n- Các gói dịch vụ tiêu chuẩn:\n  + Gói Basic (Cơ bản): Phù hợp cá nhân trải nghiệm, hỗ trợ xử lý tài liệu chuẩn và tra cứu cơ bản.\n  + Gói Pro (Chuyên nghiệp): Phù hợp nhóm làm việc/doanh nghiệp vừa, tốc độ ưu tiên, OCR đa ngôn ngữ và tư vấn chuyên sâu.\n  + Gói Enterprise (Doanh nghiệp): Tùy biến theo yêu cầu, SLA cam kết 99.9%, hỗ trợ kỹ thuật 1-1 24/7 và tích hợp API riêng.\n- Chính sách thanh toán: Hỗ trợ chuyển khoản ngân hàng (QR Pay), thẻ nội địa/quốc tế (Visa/Mastercard), ví điện tử và COD (thanh toán khi nhận hàng đối với sản phẩm vật lý). Có xuất hóa đơn VAT điện tử theo yêu cầu.\n- Chính sách vận chuyển & bàn giao: Giao hàng toàn quốc từ 1-3 ngày làm việc (nội thành 2-4 giờ); đối với dịch vụ số/phần mềm kích hoạt tài khoản ngay lập tức sau khi xác nhận thanh toán.\n- Chính sách bảo hành & đổi trả: Bảo hành chính hãng 12 tháng; hỗ trợ 1 đổi 1 hoặc hoàn tiền trong 7 ngày đầu nếu sản phẩm lỗi từ nhà sản xuất hoặc dịch vụ không đúng cam kết.}

# --- Mẫu hội thoại Few-Shot cơ sở (ngoại hoá hoàn toàn ra config) ---
docmind.customer-support.few-shot-examples[0].title=Mẫu 1 (Khách hàng hỏi mua hàng / tư vấn gói dịch vụ)
docmind.customer-support.few-shot-examples[0].customer-message=Chào shop, mình muốn tìm gói dịch vụ cho nhóm khoảng 10 người dùng thì nên chọn gói nào?
docmind.customer-support.few-shot-examples[0].assistant-response=Dạ em chào Anh/Chị ạ! Với quy mô nhóm khoảng 10 thành viên, Anh/Chị nên lựa chọn **Gói Pro (Chuyên nghiệp)** vì gói này tối ưu cho nhóm làm việc, hỗ trợ tốc độ xử lý ưu tiên và tính năng tra cứu chuyên sâu. Nếu có trích dẫn từ bảng giá tài liệu, em xin phép đính kèm tại [1]. Anh/Chị có muốn em gửi báo giá chi tiết và hướng dẫn đăng ký dùng thử ngay không ạ?
docmind.customer-support.few-shot-examples[1].title=Mẫu 2 (Khách hàng hỏi sử dụng dịch vụ / bảo hành đổi trả)
docmind.customer-support.few-shot-examples[1].customer-message=Mình mới thanh toán xong thì bao lâu dùng được? Nếu dịch vụ lỗi có được đổi trả không?
docmind.customer-support.few-shot-examples[1].assistant-response=Dạ cảm ơn Anh/Chị đã tin tưởng sử dụng dịch vụ! Ngay sau khi hệ thống xác nhận thanh toán, tài khoản dịch vụ số sẽ được **kích hoạt ngay lập tức** để Anh/Chị sử dụng. Về quyền lợi bảo hành, bên em cam kết bảo hành 12 tháng và hỗ trợ **1 đổi 1 hoặc hoàn tiền trong 7 ngày đầu** nếu phát sinh lỗi từ nhà sản xuất hoặc không đúng cam kết. Anh/Chị cần hỗ trợ kích hoạt bước nào em hướng dẫn chi tiết ngay nhé ạ!

# --- Cấu hình chấm điểm nhận diện kịch bản khách hàng ---
docmind.customer-support.scenario-scoring.high-keyword-weight=${DOCMIND_CUSTOMER_HIGH_KEYWORD_WEIGHT:3}
docmind.customer-support.scenario-scoring.medium-keyword-weight=${DOCMIND_CUSTOMER_MEDIUM_KEYWORD_WEIGHT:2}
docmind.customer-support.scenario-scoring.secondary-scenario-threshold=${DOCMIND_CUSTOMER_SECONDARY_THRESHOLD:2}
docmind.customer-support.scenario-scoring.sales-excluded-phrases=${DOCMIND_CUSTOMER_SALES_EXCLUDED:tham gia,danh gia,chuyen gia,quoc gia,gia dinh,gia han}

# --- Kịch bản 1: SALES (Tư vấn Mua hàng & Báo giá) ---
docmind.customer-support.scenarios.SALES.title=Tư vấn Mua hàng & Báo giá
docmind.customer-support.scenarios.SALES.description=Tư vấn chọn sản phẩm/gói dịch vụ phù hợp nhu cầu, báo giá chi tiết, thông tin khuyến mãi và hướng dẫn đặt mua.
docmind.customer-support.scenarios.SALES.playbook-instructions=- Khách hàng đang có nhu cầu TÌM HIỂU MUA HÀNG hoặc ĐĂNG KÝ DỊCH VỤ.\n- Phân tích nhu cầu của khách hàng, giới thiệu sản phẩm/gói dịch vụ phù hợp nhất kèm lợi ích thực tế.\n- Cung cấp thông tin giá cả, ưu đãi và quyền lợi một cách minh bạch, rõ ràng dựa trên dữ liệu tài liệu/chính sách.\n- Kết thúc bằng lời gợi ý nhẹ nhàng (Call-to-Action) giúp khách hàng dễ dàng lựa chọn hoặc đặt mua ngay.
docmind.customer-support.scenarios.SALES.default-evolution-guideline=Khi tư vấn mua hàng (SALES), hãy phân loại rõ Gói Basic, Gói Pro và Gói Enterprise theo quy mô người dùng để khách hàng dễ lựa chọn.
docmind.customer-support.scenarios.SALES.default-rag-evolution-guideline=Khi tư vấn báo giá (SALES) có tài liệu RAG, luôn nêu rõ tên gói dịch vụ, mức giá cụ thể kèm trích dẫn [n] và gợi ý khách hàng đăng ký dùng thử.
docmind.customer-support.scenarios.SALES.suggested-questions[0]=Các gói dịch vụ hiện tại có mức giá và ưu đãi như thế nào?
docmind.customer-support.scenarios.SALES.suggested-questions[1]=Tôi nên chọn gói sản phẩm/dịch vụ nào phù hợp với nhu cầu cá nhân hoặc doanh nghiệp?
docmind.customer-support.scenarios.SALES.suggested-questions[2]=Quy trình đặt mua và kích hoạt dịch vụ diễn ra trong bao lâu?
docmind.customer-support.scenarios.SALES.aliases=sales,mua_hang,muahang,ban_hang,banhang,buy,purchase,tu_van_mua_hang,tuvanmuahang,tu_van_ban_hang,pricing,bao_gia,baogia
docmind.customer-support.scenarios.SALES.high-keywords=muon mua,dat mua,tu van mua,bao gia,bang gia,muc gia,bao nhieu tien,gia bao nhieu,tu van goi,chon goi,goi basic,goi pro,goi enterprise,chot don,dat hang
docmind.customer-support.scenarios.SALES.medium-keywords=mua,gia,khuyen mai,uu dai,giam gia,goi dich vu,san pham

# --- Kịch bản 2: SERVICE_SUPPORT (Hỗ trợ Sử dụng Dịch vụ & Kỹ thuật) ---
docmind.customer-support.scenarios.SERVICE_SUPPORT.title=Hỗ trợ Sử dụng Dịch vụ & Kỹ thuật
docmind.customer-support.scenarios.SERVICE_SUPPORT.description=Hướng dẫn sử dụng tính năng, kích hoạt tài khoản, cấu hình dịch vụ và xử lý sự cố kỹ thuật trong quá trình sử dụng.
docmind.customer-support.scenarios.SERVICE_SUPPORT.playbook-instructions=- Khách hàng đang SỬ DỤNG DỊCH VỤ hoặc cần HỖ TRỢ KỸ THUẬT / HƯỚNG DẪN THAO TÁC.\n- Trình bày hướng dẫn từng bước (Step-by-step) mạch lạc, dễ thực hiện theo.\n- Nếu khách hàng gặp vướng mắc hoặc lỗi dịch vụ, giải thích nguyên nhân ngắn gọn và đưa ra giải pháp khắc phục ngay.\n- Chủ động hỏi thăm xem khách hàng đã thao tác thành công chưa và sẵn sàng hỗ trợ chuyên sâu.
docmind.customer-support.scenarios.SERVICE_SUPPORT.default-evolution-guideline=Khi hướng dẫn sử dụng dịch vụ hoặc xử lý kỹ thuật (SERVICE_SUPPORT), luôn trình bày theo từng bước đánh số (Bước 1, Bước 2...) và hỏi xác nhận kết quả thao tác.
docmind.customer-support.scenarios.SERVICE_SUPPORT.suggested-questions[0]=Hướng dẫn tôi các bước bắt đầu sử dụng dịch vụ sau khi đăng ký?
docmind.customer-support.scenarios.SERVICE_SUPPORT.suggested-questions[1]=Làm thế nào để tích hợp hoặc nâng cấp gói dịch vụ đang sử dụng?
docmind.customer-support.scenarios.SERVICE_SUPPORT.suggested-questions[2]=Khi gặp sự cố kỹ thuật thì tôi được hỗ trợ qua những kênh nào?
