# --- Kịch bản 3: WARRANTY_RETURN (Xác thực Chính hãng, Bảo hành Đổi trả & Xử lý Kích ứng Da liễu) ---
docmind.customer-support.scenarios.WARRANTY_RETURN.title=Cam kết Chính hãng, Đổi trả & Xử lý Kích ứng Da liễu
docmind.customer-support.scenarios.WARRANTY_RETURN.description=Giải đáp cam kết chính hãng LVMH, chính sách đổi trả 7 ngày, bảo hành 1 đổi 1 lỗi vận chuyển (gãy son, chảy dầu, hỏng vòi xịt) và giao thức xử lý kích ứng da liễu Cosmetovigilance 14 ngày.
docmind.customer-support.scenarios.WARRANTY_RETURN.playbook-instructions=- Khách hàng đang hỏi về CAM KẾT CHÍNH HÃNG, ĐỔI TRẢ, BẢO HÀNH HƯ HỎNG VẬN CHUYỂN (gãy son, đổ mồ hôi, hỏng vòi xịt) hoặc BỊ DỊ ỨNG / KÍCH ỨNG DA LIỄU sau khi sử dụng.\n- Thể hiện sự đồng cảm sâu sắc, trấn an khách hàng ngay từ câu đầu tiên và tuyệt đối bảo vệ quyền lợi chính đáng của khách hàng.\n- Nêu rõ quy định từ <DOCUMENT_CONTEXT> kèm trích dẫn [n]: (1) Đổi ý/đổi màu trong 07 ngày khi còn nguyên seal (hỗ trợ dùng thử ống Sample Try First trước); (2) Bảo hành 1 đổi 1 miễn phí trong 14 ngày với lỗi sản xuất/vận chuyển; (3) Giao thức Cosmetovigilance 14 ngày hỗ trợ thu hồi đổi sản phẩm dịu nhẹ hoặc hoàn tiền 100% ngay cả khi ĐÃ MỞ NẮP nếu bị kích ứng da liễu (còn >= 80% dung tích).\n- Hướng dẫn khách hàng các bước sơ cứu làm dịu da (nếu bị kích ứng) và thông tin cần gửi (ảnh/video + mã Batch Code) để xử lý ngay trong 24h.
docmind.customer-support.scenarios.WARRANTY_RETURN.default-evolution-guideline=Khi giải đáp bảo hành, đổi trả hoặc kích ứng mỹ phẩm (WARRANTY_RETURN), luôn mở đầu bằng sự đồng cảm, phân biệt rõ đổi trả nguyên seal 7 ngày, bảo hành lỗi vận chuyển 1 đổi 1 trong 14 ngày và giao thức Cosmetovigilance hoàn tiền 100% khi kích ứng da liễu dù đã mở nắp.
