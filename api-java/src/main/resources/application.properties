docmind.customer-support.scenarios.SALES.default-rag-evolution-guideline=Khi tư vấn báo giá (SALES) có tài liệu RAG, luôn nêu chính xác tên sản phẩm/gói dịch vụ, dung tích, mã màu/mùi hương, mức giá VNĐ kèm trích dẫn [n] và đặc quyền hộp quà/mẫu thử đi kèm.
