# Chiến lược Tự tiến hoá Học hỏi sau các lần chat (EvoAgentX TextGrad & MIPRO)
# ============================================================
docmind.customer-support.evolution.enabled=${DOCMIND_CUSTOMER_EVO_ENABLED:true}
docmind.customer-support.evolution.strategy=${DOCMIND_CUSTOMER_EVO_STRATEGY:evoagentx-textgrad-mipro}
docmind.customer-support.evolution.auto-evolve-after-chat=${DOCMIND_CUSTOMER_EVO_AUTO:true}
