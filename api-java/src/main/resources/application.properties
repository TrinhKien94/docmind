spring.application.name=${SPRING_APPLICATION_NAME:docmind-api}
server.port=${SERVER_PORT:8090}

# ============================================================
# Datasource — PostgreSQL + pgvector
# Giá trị thật nằm trong .env; ngoài compose trỏ localhost:5433.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/docmind}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:docmind}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:docmind}

# JPA: Flyway sở hữu schema -> Hibernate chỉ validate, không auto-ddl.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true

# Flyway migrations (db/migration/V*.sql)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# ============================================================
# CORS Configuration (ngoại hoá hoàn toàn ra config)
# ============================================================
docmind.cors.path-pattern=${DOCMIND_CORS_PATH_PATTERN:/api/**}
docmind.cors.allowed-origin-patterns=${DOCMIND_CORS_ALLOWED_ORIGINS:*}
docmind.cors.allowed-methods=${DOCMIND_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
docmind.cors.allowed-headers=${DOCMIND_CORS_ALLOWED_HEADERS:*}
docmind.cors.exposed-headers=${DOCMIND_CORS_EXPOSED_HEADERS:X-Correlation-Id}
docmind.cors.allow-credentials=${DOCMIND_CORS_ALLOW_CREDENTIALS:false}
docmind.cors.max-age-seconds=${DOCMIND_CORS_MAX_AGE_SECONDS:3600}

# ============================================================
# File Upload & MIME Validation
# ============================================================
spring.servlet.multipart.max-file-size=${DOCMIND_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${DOCMIND_MAX_REQUEST_SIZE:50MB}
docmind.upload.default-filename=${DOCMIND_UPLOAD_DEFAULT_FILENAME:upload}
docmind.upload.fallback-mime=${DOCMIND_UPLOAD_FALLBACK_MIME:application/octet-stream}
docmind.upload.allowed-mimes=${DOCMIND_UPLOAD_ALLOWED_MIMES:application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/html,text/markdown,text/plain,image/png,image/jpeg}

# ============================================================
# doc-service-py (parser) — client REST, propagate X-Correlation-Id.
# ============================================================
docmind.doc-service.base-url=${DOC_SERVICE_BASE_URL:http://localhost:8091}
docmind.doc-service.connect-timeout-ms=${DOC_SERVICE_CONNECT_TIMEOUT_MS:5000}
docmind.doc-service.read-timeout-ms=${DOC_SERVICE_READ_TIMEOUT_MS:60000}
docmind.doc-service.poll-interval-ms=${DOC_SERVICE_POLL_INTERVAL_MS:1500}
docmind.doc-service.poll-max-attempts=${DOC_SERVICE_POLL_MAX_ATTEMPTS:40}
docmind.doc-service.parse-endpoint-path=${DOC_SERVICE_PARSE_PATH:/v1/parse}
docmind.doc-service.job-status-endpoint-path=${DOC_SERVICE_JOB_STATUS_PATH:/v1/jobs/{jobId}}
docmind.doc-service.job-result-endpoint-path=${DOC_SERVICE_JOB_RESULT_PATH:/v1/jobs/{jobId}/result}

# ============================================================
# LLM (9Router -> Codex GPT-6 Astra) — Tích hợp chính mặc định.
# Định tuyến các câu hỏi chat RAG & CSKH qua 9Router tới Codex Astra.
# ============================================================
ninerouter.enabled=${NINEROUTER_ENABLED:true}
ninerouter.base-url=${NINEROUTER_BASE_URL:http://localhost:20128/v1}
ninerouter.api-key=${NINEROUTER_API_KEY:sk-9af495182557ea7e-713jdu-0feaf415}
ninerouter.model=${NINEROUTER_MODEL:codex/gpt-6-astra}
ninerouter.codex-relay-url=${CODEX_RELAY_URL:http://127.0.0.1:11500/v1}
ninerouter.codex-auth-token=${CODEX_AUTH_TOKEN:}
ninerouter.codex-auth-file-path=${CODEX_AUTH_FILE_PATH:.codex/auth.json}
ninerouter.chat-completions-path=${NINEROUTER_COMPLETIONS_PATH:/chat/completions}
ninerouter.fallback-error-message=${NINEROUTER_FALLBACK_ERROR:[9router-error] Không thể kết nối tới 9Router hoặc Codex relay.}
ninerouter.timeout-ms=${NINEROUTER_TIMEOUT_MS:60000}

# ============================================================
# LLM (Gemini) — ĐỂ TRỐNG mặc định => chat dùng 9Router hoặc stub.
# Chỉ khi gemini.api.keys có giá trị và 9router tắt, GeminiLlmClient mới kích hoạt.
# ============================================================
gemini.api.keys=${GEMINI_API_KEYS:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.generate-path-template=${GEMINI_GENERATE_PATH:/models/{model}:generateContent?key={key}}
gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:10000}
gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:60000}

# ============================================================
# Chat/RAG (Java-only) — tham số retrieval & prompt hỏi đáp tài liệu.
# ============================================================
docmind.chat.top-k=${DOCMIND_CHAT_TOP_K:5}
docmind.chat.candidate-k=${DOCMIND_CHAT_CANDIDATE_K:20}
docmind.chat.rrf-k=${DOCMIND_CHAT_RRF_K:60}
docmind.chat.snippet-max-length=${DOCMIND_CHAT_SNIPPET_MAX_LENGTH:240}
docmind.chat.fts-config=${DOCMIND_CHAT_FTS_CONFIG:simple}
docmind.chat.system-role-instruction=${DOCMIND_CHAT_ROLE_INSTRUCTION:Bạn là trợ lý hỏi-đáp tài liệu. Trả lời bằng tiếng Việt, DỰA HOÀN TOÀN vào phần <DOCUMENT_CONTEXT> bên dưới.}
docmind.chat.not-found-message=${DOCMIND_CHAT_NOT_FOUND_MSG:Không tìm thấy thông tin này trong tài liệu.}
docmind.chat.answer-prompt-suffix=${DOCMIND_CHAT_ANSWER_SUFFIX:Trả lời (kèm trích dẫn [n]):}

# ============================================================
# Customer Support & Sales API (Prompt được huấn luyện trước)
# Người dùng đóng vai trò khách hàng mua hàng hoặc sử dụng dịch vụ.
# ============================================================
docmind.customer-support.store-name=${DOCMIND_CUSTOMER_STORE_NAME:DocMind Store & Digital Services}
docmind.customer-support.hotline=${DOCMIND_CUSTOMER_HOTLINE:1900-6868}
docmind.customer-support.support-email=${DOCMIND_CUSTOMER_EMAIL:cskh@docmind.vn}
docmind.customer-support.working-hours=${DOCMIND_CUSTOMER_HOURS:08:00 - 22:00 (Thứ 2 - Chủ Nhật)}
docmind.customer-support.assistant-persona=${DOCMIND_CUSTOMER_ASSISTANT_PERSONA:Chuyên viên Tư vấn Bán hàng & Chăm sóc Khách hàng (Sales & Customer Service AI Specialist)}
docmind.customer-support.default-customer-role=${DOCMIND_CUSTOMER_DEFAULT_ROLE:Khách hàng mua hàng hoặc sử dụng dịch vụ}
docmind.customer-support.default-customer-name=${DOCMIND_CUSTOMER_DEFAULT_NAME:Quý khách}
docmind.customer-support.fallback-customer-salutation=${DOCMIND_CUSTOMER_FALLBACK_SALUTATION:Anh/Chị}
docmind.customer-support.customer-role-label=${DOCMIND_CUSTOMER_ROLE_LABEL:Khách hàng}
docmind.customer-support.assistant-role-label=${DOCMIND_CUSTOMER_ASSISTANT_LABEL:Chuyên viên CSKH}
docmind.customer-support.assistant-role-aliases=${DOCMIND_CUSTOMER_ASSISTANT_ALIASES:assistant,agent,support,bot,cskh}
docmind.customer-support.default-top-k=${DOCMIND_CUSTOMER_TOP_K:5}
docmind.customer-support.min-top-k=${DOCMIND_CUSTOMER_MIN_TOP_K:1}
docmind.customer-support.max-top-k=${DOCMIND_CUSTOMER_MAX_TOP_K:50}
docmind.customer-support.snippet-max-length=${DOCMIND_CUSTOMER_SNIPPET_MAX_LENGTH:240}
docmind.customer-support.auto-discover-documents=${DOCMIND_CUSTOMER_AUTO_DISCOVER_DOCS:true}
docmind.customer-support.max-auto-discover-documents=${DOCMIND_CUSTOMER_MAX_AUTO_DOCS:20}
docmind.customer-support.max-history-turns=${DOCMIND_CUSTOMER_MAX_HISTORY_TURNS:10}
docmind.customer-support.max-history-turn-chars=${DOCMIND_CUSTOMER_MAX_HISTORY_TURN_CHARS:1000}
docmind.customer-support.prompt-template-id=${DOCMIND_CUSTOMER_PROMPT_ID:customer-sales-service-v1}
docmind.customer-support.custom-system-prompt=${DOCMIND_CUSTOMER_SYSTEM_PROMPT:}
docmind.customer-support.sample-preview-question=${DOCMIND_CUSTOMER_SAMPLE_PREVIEW_QUESTION:Tư vấn giúp tôi gói dịch vụ phù hợp và chính sách bảo hành khi mua hàng?}
docmind.customer-support.no-document-context-note=${DOCMIND_CUSTOMER_NO_DOC_NOTE:(Chưa có đoạn trích tài liệu cụ thể nào được đính kèm; hãy tư vấn dựa trên <STORE_POLICY_CONTEXT> và kịch bản nghiệp vụ đã huấn luyện.)}
docmind.customer-support.answer-prompt-suffix=${DOCMIND_CUSTOMER_ANSWER_SUFFIX:Trả lời tư vấn cho khách hàng (kèm trích dẫn [n] nếu dùng tài liệu):}
docmind.customer-support.default-policy-context=${DOCMIND_CUSTOMER_DEFAULT_POLICY:- Chính sách mua hàng & đặt hàng: Hỗ trợ đặt hàng trực tuyến 24/7, xác nhận đơn tự động qua SMS/Email, tư vấn chọn sản phẩm và gói dịch vụ theo nhu cầu thực tế.\n- Các gói dịch vụ tiêu chuẩn:\n  + Gói Basic (Cơ bản): Phù hợp cá nhân trải nghiệm, hỗ trợ xử lý tài liệu chuẩn và tra cứu cơ bản.\n  + Gói Pro (Chuyên nghiệp): Phù hợp nhóm làm việc/doanh nghiệp vừa, tốc độ ưu tiên, OCR đa ngôn ngữ và tư vấn chuyên sâu.\n  + Gói Enterprise (Doanh nghiệp): Tùy biến theo yêu cầu, SLA cam kết 99.9%, hỗ trợ kỹ thuật 1-1 24/7 và tích hợp API riêng.\n- Chính sách thanh toán: Hỗ trợ chuyển khoản ngân hàng (QR Pay), thẻ nội địa/quốc tế (Visa/Mastercard), ví điện tử và COD (thanh toán khi nhận hàng đối với sản phẩm vật lý). Có xuất hóa đơn VAT điện tử theo yêu cầu.\n- Chính sách vận chuyển & bàn giao: Giao hàng toàn quốc từ 1-3 ngày làm việc (nội thành 2-4 giờ); đối với dịch vụ số/phần mềm kích hoạt tài khoản ngay lập tức sau khi xác nhận thanh toán.\n- Chính sách bảo hành & đổi trả: Bảo hành chính hãng 12 tháng; hỗ trợ 1 đổi 1 hoặc hoàn tiền trong 7 ngày đầu nếu sản phẩm lỗi từ nhà sản xuất hoặc dịch vụ không đúng cam kết.}

# --- Cấu hình chấm điểm nhận diện kịch bản khách hàng ---
docmind.customer-support.scenario-scoring.high-keyword-weight=${DOCMIND_CUSTOMER_HIGH_KEYWORD_WEIGHT:3}
docmind.customer-support.scenario-scoring.medium-keyword-weight=${DOCMIND_CUSTOMER_MEDIUM_KEYWORD_WEIGHT:2}
docmind.customer-support.scenario-scoring.secondary-scenario-threshold=${DOCMIND_CUSTOMER_SECONDARY_THRESHOLD:2}
docmind.customer-support.scenario-scoring.sales-excluded-phrases=${DOCMIND_CUSTOMER_SALES_EXCLUDED:tham gia,danh gia,chuyen gia,quoc gia,gia dinh,gia han}

# ============================================================
# Chiến lược Tự tiến hoá Học hỏi sau các lần chat (EvoAgentX TextGrad & MIPRO)
# ============================================================
docmind.customer-support.evolution.enabled=${DOCMIND_CUSTOMER_EVO_ENABLED:true}
docmind.customer-support.evolution.strategy=${DOCMIND_CUSTOMER_EVO_STRATEGY:evoagentx-textgrad-mipro}
docmind.customer-support.evolution.auto-evolve-after-chat=${DOCMIND_CUSTOMER_EVO_AUTO:true}
docmind.customer-support.evolution.persist-to-disk=${DOCMIND_CUSTOMER_EVO_PERSIST:true}
docmind.customer-support.evolution.storage-path=${DOCMIND_CUSTOMER_EVO_STORAGE_PATH:data/customer-evolution-memory.json}
docmind.customer-support.evolution.llm-reflection-enabled=${DOCMIND_CUSTOMER_EVO_LLM_REFLECTION:false}
docmind.customer-support.evolution.llm-reflection-on-negative-feedback=${DOCMIND_CUSTOMER_EVO_LLM_ON_NEG_FEEDBACK:true}
docmind.customer-support.evolution.llm-reflection-every-n-interactions=${DOCMIND_CUSTOMER_EVO_LLM_INTERVAL:5}
docmind.customer-support.evolution.min-score-for-exemplar=${DOCMIND_CUSTOMER_EVO_MIN_EXEMPLAR_SCORE:0.80}
docmind.customer-support.evolution.low-score-threshold-for-correction=${DOCMIND_CUSTOMER_EVO_LOW_SCORE_THRESHOLD:0.78}
docmind.customer-support.evolution.max-learned-guidelines-per-scenario=${DOCMIND_CUSTOMER_EVO_MAX_GUIDELINES:10}
docmind.customer-support.evolution.max-few-shot-exemplars-per-scenario=${DOCMIND_CUSTOMER_EVO_MAX_EXEMPLARS:4}
docmind.customer-support.evolution.max-few-shot-exemplars-in-prompt=${DOCMIND_CUSTOMER_EVO_PROMPT_EXEMPLARS:2}
docmind.customer-support.evolution.max-guidelines-in-prompt=${DOCMIND_CUSTOMER_EVO_PROMPT_GUIDELINES:5}
docmind.customer-support.evolution.max-episode-history-size=${DOCMIND_CUSTOMER_EVO_MAX_EPISODES:200}
docmind.customer-support.evolution.max-recent-gradients=${DOCMIND_CUSTOMER_EVO_MAX_GRADIENTS:50}
docmind.customer-support.evolution.min-complete-answer-chars=${DOCMIND_CUSTOMER_EVO_MIN_ANSWER_CHARS:80}
docmind.customer-support.evolution.evolved-section-header=${DOCMIND_CUSTOMER_EVO_HEADER:# TRI THỨC TỰ TIẾN HOÁ TỪ LỊCH SỬ CSKH (EVOAGENTX SELF-EVOLVED GUIDELINES)}

# ============================================================
# Embedding — dim 384 khớp paraphrase-multilingual-MiniLM-L12-v2.
# remote.enabled=true => gọi doc-service-py POST /v1/embed (cùng base-url parser);
# lỗi/tắt => rơi về stub tất định cho đúng call đó (ingest không fail cứng).
# ============================================================
docmind.embedding.dim=${DOCMIND_EMBEDDING_DIM:384}
docmind.embedding.remote.enabled=${DOCMIND_EMBEDDING_REMOTE_ENABLED:true}
docmind.embedding.remote.endpoint-path=${DOCMIND_EMBEDDING_ENDPOINT_PATH:/v1/embed}

# Logging level (dùng chung cả hai service qua DOCMIND_LOG_LEVEL)
logging.level.root=${DOCMIND_LOG_LEVEL:INFO}
logging.level.com.example.docmind=${DOCMIND_LOG_LEVEL:INFO}
