# --- Kịch bản 4: ORDER_BILLING (Đơn hàng, Thanh toán & Vận chuyển) ---
docmind.customer-support.scenarios.ORDER_BILLING.title=Đơn hàng, Thanh toán & Vận chuyển
docmind.customer-support.scenarios.ORDER_BILLING.description=Hỗ trợ tra cứu trạng thái đơn hàng, phương thức thanh toán, xuất hóa đơn VAT và thời gian giao nhận/bàn giao.
docmind.customer-support.scenarios.ORDER_BILLING.playbook-instructions=- Khách hàng đang quan tâm đến ĐƠN HÀNG, THANH TOÁN, HÓA ĐƠN VAT hoặc VẬN CHUYỂN / BÀN GIAO.\n- Hướng dẫn chi tiết các phương thức thanh toán được hỗ trợ và thời gian xác nhận đơn hàng.\n- Nêu rõ thời gian giao nhận sản phẩm vật lý hoặc kích hoạt tài khoản dịch vụ số.\n- Giải đáp rõ thủ tục xuất hóa đơn VAT và bảo mật giao dịch cho khách hàng.
docmind.customer-support.scenarios.ORDER_BILLING.default-evolution-guideline=Khi tư vấn đơn hàng & thanh toán (ORDER_BILLING), luôn thông tin rõ các phương thức thanh toán (QR Pay, Visa/Mastercard, COD), thời gian kích hoạt và hỗ trợ xuất hóa đơn VAT.
docmind.customer-support.scenarios.ORDER_BILLING.suggested-questions[0]=Cửa hàng hỗ trợ những hình thức thanh toán nào và có xuất hóa đơn VAT không?
