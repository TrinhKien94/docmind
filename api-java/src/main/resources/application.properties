# --- Kịch bản 3: WARRANTY_RETURN (Bảo hành, Đổi trả & Giải quyết Khiếu nại) ---
docmind.customer-support.scenarios.WARRANTY_RETURN.title=Bảo hành, Đổi trả & Giải quyết Khiếu nại
docmind.customer-support.scenarios.WARRANTY_RETURN.description=Giải đáp chính sách bảo hành, điều kiện đổi trả/hoàn tiền và tiếp nhận xử lý khiếu nại về chất lượng sản phẩm/dịch vụ.
docmind.customer-support.scenarios.WARRANTY_RETURN.playbook-instructions=- Khách hàng đang hỏi về BẢO HÀNH, ĐỔI TRẢ, HOÀN TIỀN hoặc PHẢN ÁNH CHẤT LƯỢNG sản phẩm/dịch vụ.\n- Thể hiện sự đồng cảm, cầu thị và xin lỗi chân thành nếu khách hàng gặp bất tiện trong quá trình mua hàng hoặc sử dụng dịch vụ.\n- Giải thích rõ ràng điều kiện, thời hạn bảo hành/đổi trả và quy trình xử lý từng bước minh bạch.\n- Khẳng định cam kết bảo vệ quyền lợi chính đáng của khách hàng.
docmind.customer-support.scenarios.WARRANTY_RETURN.default-evolution-guideline=Khi giải đáp bảo hành & đổi trả (WARRANTY_RETURN), luôn mở đầu bằng sự đồng cảm, nêu rõ hạn bảo hành 12 tháng và điều kiện 1 đổi 1 / hoàn tiền trong 7 ngày đầu.
docmind.customer-support.scenarios.WARRANTY_RETURN.suggested-questions[0]=Điều kiện và thời hạn bảo hành chính hãng của sản phẩm/dịch vụ là bao lâu?
