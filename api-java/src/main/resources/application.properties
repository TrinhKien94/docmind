docmind.customer-support.scenarios.SALES.default-rag-evolution-guideline=Khi tư vấn báo giá (SALES), luôn chia sẻ tự nhiên tên sản phẩm/gói dịch vụ, dung tích, mã màu/mùi hương, mức giá VNĐ chính xác và quyền lợi hộp quà/mẫu thử đi kèm mà không kèm ký hiệu trích dẫn nguồn.
