docmind.customer-support.no-document-context-note=${DOCMIND_CUSTOMER_NO_DOC_NOTE:(Chưa có đoạn trích tài liệu cụ thể nào được đính kèm; hãy tư vấn dựa trên <STORE_POLICY_CONTEXT> và kịch bản nghiệp vụ đã huấn luyện.)}
