spring.application.name=${SPRING_APPLICATION_NAME:docmind-api}
server.port=${SERVER_PORT:8090}

# ============================================================
# Datasource — PostgreSQL + pgvector
# Giá trị thật nằm trong .env; ngoài compose trỏ localhost:5433.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/docmind}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:docmind}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:docmind}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:500}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:250}
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_FAIL_TIMEOUT_MS:-1}

# JPA: Flyway sở hữu schema -> Hibernate chỉ validate, không auto-ddl.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true

# Flyway migrations (db/migration/V*.sql)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# ============================================================
# CORS Configuration (ngoại hoá hoàn toàn ra config)
# ============================================================
docmind.cors.path-pattern=${DOCMIND_CORS_PATH_PATTERN:/api/**}
docmind.cors.allowed-origin-patterns=${DOCMIND_CORS_ALLOWED_ORIGINS:*}
docmind.cors.allowed-methods=${DOCMIND_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
docmind.cors.allowed-headers=${DOCMIND_CORS_ALLOWED_HEADERS:*}
docmind.cors.exposed-headers=${DOCMIND_CORS_EXPOSED_HEADERS:X-Correlation-Id}
docmind.cors.allow-credentials=${DOCMIND_CORS_ALLOW_CREDENTIALS:false}
docmind.cors.max-age-seconds=${DOCMIND_CORS_MAX_AGE_SECONDS:3600}

# ============================================================
# File Upload & MIME Validation
# ============================================================
spring.servlet.multipart.max-file-size=${DOCMIND_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${DOCMIND_MAX_REQUEST_SIZE:50MB}
docmind.upload.default-filename=${DOCMIND_UPLOAD_DEFAULT_FILENAME:upload}
docmind.upload.fallback-mime=${DOCMIND_UPLOAD_FALLBACK_MIME:application/octet-stream}
docmind.upload.allowed-mimes=${DOCMIND_UPLOAD_ALLOWED_MIMES:application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/html,text/markdown,text/x-web-markdown,text/x-markdown,text/plain,image/png,image/jpeg}

# ============================================================
# doc-service-py (parser) — client REST, propagate X-Correlation-Id.
# ============================================================
docmind.doc-service.base-url=${DOC_SERVICE_BASE_URL:http://localhost:8091}
docmind.doc-service.connect-timeout-ms=${DOC_SERVICE_CONNECT_TIMEOUT_MS:5000}
docmind.doc-service.read-timeout-ms=${DOC_SERVICE_READ_TIMEOUT_MS:60000}
docmind.doc-service.poll-interval-ms=${DOC_SERVICE_POLL_INTERVAL_MS:1500}
docmind.doc-service.poll-max-attempts=${DOC_SERVICE_POLL_MAX_ATTEMPTS:40}
docmind.doc-service.parse-endpoint-path=${DOC_SERVICE_PARSE_PATH:/v1/parse}
docmind.doc-service.job-status-endpoint-path=${DOC_SERVICE_JOB_STATUS_PATH:/v1/jobs/{jobId}}
docmind.doc-service.job-result-endpoint-path=${DOC_SERVICE_JOB_RESULT_PATH:/v1/jobs/{jobId}/result}

# ============================================================
# LLM (9Router -> Codex GPT-6 Astra) — Tích hợp chính mặc định.
# Định tuyến các câu hỏi chat RAG & CSKH qua 9Router tới Codex Astra.
# ============================================================
ninerouter.enabled=${NINEROUTER_ENABLED:true}
ninerouter.base-url=${NINEROUTER_BASE_URL:http://localhost:20128/v1}
ninerouter.api-key=${NINEROUTER_API_KEY:sk-9af495182557ea7e-713jdu-0feaf415}
ninerouter.model=${NINEROUTER_MODEL:codex/gpt-6-astra}
ninerouter.codex-relay-url=${CODEX_RELAY_URL:http://127.0.0.1:11500/v1}
ninerouter.codex-auth-token=${CODEX_AUTH_TOKEN:}
ninerouter.codex-auth-file-path=${CODEX_AUTH_FILE_PATH:.codex/auth.json}
ninerouter.chat-completions-path=${NINEROUTER_COMPLETIONS_PATH:/chat/completions}
ninerouter.fallback-error-message=${NINEROUTER_FALLBACK_ERROR:[9router-error] Không thể kết nối tới 9Router hoặc Codex relay.}
ninerouter.timeout-ms=${NINEROUTER_TIMEOUT_MS:60000}

# ============================================================
# LLM (Gemini) — ĐỂ TRỐNG mặc định => chat dùng 9Router hoặc stub.
# Chỉ khi gemini.api.keys có giá trị và 9router tắt, GeminiLlmClient mới kích hoạt.
# ============================================================
gemini.api.keys=${GEMINI_API_KEYS:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.generate-path-template=${GEMINI_GENERATE_PATH:/models/{model}:generateContent?key={key}}
gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:10000}
gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:60000}

# ============================================================
# Chat/RAG (Java-only) — tham số retrieval & prompt hỏi đáp tài liệu.
# ============================================================
docmind.chat.top-k=${DOCMIND_CHAT_TOP_K:5}
docmind.chat.candidate-k=${DOCMIND_CHAT_CANDIDATE_K:20}
docmind.chat.rrf-k=${DOCMIND_CHAT_RRF_K:60}
docmind.chat.snippet-max-length=${DOCMIND_CHAT_SNIPPET_MAX_LENGTH:240}
docmind.chat.fts-config=${DOCMIND_CHAT_FTS_CONFIG:simple}
docmind.chat.system-role-instruction=${DOCMIND_CHAT_ROLE_INSTRUCTION:Bạn là trợ lý hỏi-đáp tài liệu. Trả lời bằng tiếng Việt, DỰA HOÀN TOÀN vào phần <DOCUMENT_CONTEXT> bên dưới.}
docmind.chat.not-found-message=${DOCMIND_CHAT_NOT_FOUND_MSG:Không tìm thấy thông tin này trong tài liệu.}
docmind.chat.answer-prompt-suffix=${DOCMIND_CHAT_ANSWER_SUFFIX:Trả lời (kèm trích dẫn [n]):}

