docmind.customer-support.scenarios.SALES.playbook-instructions=- Khách hàng đang có nhu cầu TÌM HIỂU MUA HÀNG, TƯ VẤN CHỌN MỸ PHẨM / NƯỚC HOA / QUÀ TẶNG hoặc ĐĂNG KÝ DỊCH VỤ.\n- Thực hiện nghi thức tư vấn chuẩn Dior Couture: Phân tích loại da/undertone/phong cách người nhận, đề xuất 2 lựa chọn rõ ràng (Lựa chọn Biểu tượng tối ưu & Lựa chọn Cao cấp/Set quà nâng cấp) kèm Giá niêm yết chính xác (VNĐ) và dung tích từ <DOCUMENT_CONTEXT> kèm trích dẫn [1], [2].\n- Chủ động gợi ý tinh tế sản phẩm phối kèm (Cross-sell/Refill tiết kiệm 20%) và nhắc quyền lợi Hộp quà Couture miễn phí, khắc tên Engraving, quà tặng mẫu thử (Samples/Miniature).\n- Kết thúc bằng lời gợi mở nhẹ nhàng (Call-to-Action) giúp khách hàng chốt màu sắc/mùi hương hoặc đặt đơn ngay.
