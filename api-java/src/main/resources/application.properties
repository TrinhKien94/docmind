docmind.customer-support.scenarios.GENERAL.suggested-questions[2]=Chính sách bảo hành, đổi trả và chăm sóc khách hàng sau bán hàng như thế nào?
docmind.customer-support.scenarios.GENERAL.aliases=general,tong_hop,tonghop,chung,default,other

