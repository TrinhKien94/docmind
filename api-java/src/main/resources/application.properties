docmind.customer-support.no-document-context-note=${DOCMIND_CUSTOMER_NO_DOC_NOTE:(Chưa có đoạn trích tài liệu cụ thể nào được đính kèm; hãy tư vấn dựa trên <STORE_POLICY_CONTEXT> và kịch bản nghiệp vụ đã huấn luyện.)}
docmind.customer-support.answer-prompt-suffix=${DOCMIND_CUSTOMER_ANSWER_SUFFIX:Trả lời tư vấn cho khách hàng với văn phong tự nhiên, ấm áp, tinh tế như chuyên viên người thật đang trò chuyện trực tiếp (tuyệt đối không gắn ký hiệu trích dẫn [1], [2] và không nhắc tên tài liệu/SOP):}
docmind.customer-support.core-rules-template=${DOCMIND_CUSTOMER_CORE_RULES_TEMPLATE:}
docmind.customer-support.default-policy-context=${DOCMIND_CUSTOMER_DEFAULT_POLICY:- Danh mục Mỹ phẩm, Trang điểm & Nước hoa Chính hãng Parfums Christian Dior Vietnam (Nhập khẩu chính ngạch LVMH từ Pháp, đầy đủ tem phụ tiếng Việt & mã Batch Code 4 ký tự):\n  + Chăm sóc da (Skincare): Sữa rửa mặt La Mousse OFF/ON (1.450.000đ); Dòng chống lão hóa Capture Totale Le Sérum (30ml: 3.450.000đ, 50ml: 4.650.000đ), Retishot 0.1% Retinol (2.950.000đ - chống chỉ định cho phụ nữ mang thai); Dòng thượng lưu Dior Prestige Hoa hồng vùng Granville La Micro-Huile de Rose (30ml: 7.400.000đ, 50ml: 9.800.000đ) & La Crème (50ml: 10.500.000đ, Lõi Refill: 8.900.000đ).\n  + Trang điểm (Makeup): Kem nền Dior Forever Matte (kiềm dầu 24h) & Forever Skin Glow (căng bóng ẩm mượt) đồng giá 1.850.000đ (Undertone N/W/CR, sắc độ 0N, 1N, 1W, 1CR, 2N, 2W); Cushion Dior Forever (1.950.000đ, Refill 1.350.000đ); Son Rouge Dior (1.290.000đ, Refill 1.030.000đ - các màu biểu tượng 999 Đỏ thuần, 720 Hồng nâu gỗ, 772 Hồng đất, 100 Nude hạnh nhân); Son dưỡng Dior Addict Lip Glow (1.150.000đ - màu 001 Pink, 004 Coral khử thâm môi, 012 Rosewood) & Lip Maximizer (1.150.000đ).\n  + Nước hoa (Fragrance): Nữ có Miss Dior Blooming Bouquet (50ml: 3.150.000đ, 100ml: 4.350.000đ), Miss Dior EDP (50ml: 3.750.000đ, 100ml: 5.150.000đ), J'adore EDP (50ml: 3.850.000đ, 100ml: 5.250.000đ) & J'adore Parfum d'Eau không cồn; Nam có Dior Sauvage EDT/EDP/Parfum (60ml từ 3.150.000đ, 100ml từ 4.150.000đ) và Sauvage Elixir (60ml: 5.350.000đ).\n- Đặc quyền Quà tặng Couture & Cá nhân hóa: Miễn phí 100% Hộp quà cứng nam châm Dior Couture + Túi giấy + Thiệp viết tay cho mọi đơn hàng; Miễn phí Khắc tên laser (Engraving tối đa 12 ký tự) cho đơn thanh toán trước; Tặng 02-03 mẫu thử (Sample 1.2ml) và Nước hoa Mini 5ml cho đơn từ 5.000.000đ.\n- Chính sách Thanh toán & Giao hàng VIP: Hỗ trợ VietQR, thẻ Visa/Mastercard, Trả góp 0% lãi suất cho đơn từ 3.000.000đ, COD đồng kiểm ngoại quan cho đơn <= 10.000.000đ, xuất hóa đơn đỏ e-VAT trong 24h. Đóng gói 3 lớp kèm túi cách nhiệt chống chảy son. Giao Hỏa tốc VIP 2 giờ tại Hà Nội & TP.HCM (miễn phí cho đơn từ 2.000.000đ), Freeship toàn quốc cho đơn từ 1.000.000đ.\n- Chính sách Đổi trả, Bảo hành & Xử lý Kích ứng Da liễu (Cosmetovigilance): Đổi trả trong 07 ngày nếu còn nguyên seal (hỗ trợ dùng ống mẫu thử Try First Sample trước khi bóc hộp full-size); Bảo hành 1 đổi 1 trong 14 ngày nếu gãy son, chảy dầu/đổ mồ hôi do vận chuyển hoặc hỏng vòi xịt nước hoa; Đặc biệt hỗ trợ thu hồi đổi sản phẩm dịu nhẹ hoặc hoàn tiền 100% trong 14 ngày theo giao thức Cosmetovigilance nếu khách bị kích ứng/dị ứng da liễu dù đã mở nắp sử dụng (dung tích còn >= 80%).\n- Dịch vụ số DocMind (Gói Basic, Gói Pro, Gói Enterprise): Hỗ trợ kích hoạt tức thì, bảo hành 12 tháng và đổi trả 7 ngày.}

# --- Mẫu hội thoại Few-Shot cơ sở (ngoại hoá hoàn toàn ra config) ---
docmind.customer-support.few-shot-examples[0].title=Mẫu 1 (Tư vấn Chọn Kem nền, Son môi & Nước hoa Dior theo loại da và sắc độ)
docmind.customer-support.few-shot-examples[0].customer-message=Chào shop, da mình hỗn hợp thiên dầu, tông da sáng vừa hơi ngả vàng thì nên chọn kem nền Dior Forever bản nào, mã màu gì và phối với son Rouge Dior màu nào tôn da?
docmind.customer-support.few-shot-examples[0].assistant-response=Dạ em chào Chị ạ! Với làn da hỗn hợp thiên dầu và sắc da sáng vừa hơi ngả ấm của mình, Chị chọn kem nền **Dior Forever Matte Foundation SPF 15 (30ml – 1.850.000 VNĐ)** tông **1W (Warm – Sáng tự nhiên tông ấm)** là chuẩn đẹp luôn ạ. Bản Matte này kiềm dầu tới 24 giờ, lên da ráo mịn, hỗ trợ thu nhỏ lỗ chân lông và tiệp màu da rất tự nhiên chứ không sợ bị xuống tông cuối ngày.\n\nĐể tôn làn da tông ấm của mình nhất, Chị có thể phối cùng son **Rouge Dior màu 720 Icône (Hồng nâu gỗ – 1.290.000 VNĐ)** nhìn rất sang và tây, hoặc nếu thích sắc đỏ rạng rỡ thì **màu 999 Velvet (Đỏ thuần biểu tượng)** là lựa chọn tuyệt vời luôn ạ. Đơn từ 2.000.000 VNĐ bên em gửi tặng kèm Chị hộp quà Couture sang trọng, 03 mẫu thử nước hoa/serum và miễn phí giao Hỏa tốc VIP trong 2 giờ nha. Chị thích sắc hồng nâu gỗ 720 hay đỏ thuần 999 hơn để em hỗ trợ khắc tên miễn phí lên thỏi son cho mình luôn ạ?
docmind.customer-support.few-shot-examples[1].title=Mẫu 2 (Xử lý Kích ứng Da liễu Cosmetovigilance & Bảo hành Đổi trả Mỹ phẩm Dior)
docmind.customer-support.few-shot-examples[1].customer-message=Mình mới mua serum Capture Totale và thỏi son Rouge Dior hôm qua. Thỏi son mở ra bị đổ mồ hôi chạm nắp, còn serum mình bôi thử 1 lần bị mẩn đỏ ngứa rát thì đã bóc seal rồi có được đổi trả không?
docmind.customer-support.few-shot-examples[1].assistant-response=Dạ trước hết em rất xin lỗi Chị vì trải nghiệm chưa trọn vẹn này ạ! Chị yên tâm nhé, quyền lợi của mình được bên em bảo vệ trọn vẹn 100% luôn ạ.\n\nTrước tiên với vùng da đang bị mẩn đỏ và ngứa rát, Chị ngưng thoa serum ngay giúp em và rửa mặt nhẹ nhàng bằng nước mát hoặc nước muối sinh lý để làm dịu da trước nha. Dù lọ serum mình đã bóc seal dùng thử rồi (dung tích còn trên 80%), bên em vẫn áp dụng chính sách chăm sóc da liễu **Cosmetovigilance trong 14 ngày** để hỗ trợ **thu hồi và hoàn tiền 100%** (hoặc đổi sang dòng phục hồi dịu nhẹ hơn) nên Chị đừng lo lắng nhé.\n\nCòn với thỏi son Rouge Dior bị đổ mồ hôi chạm nắp do sốc nhiệt khi vận chuyển, bên em sẽ **bảo hành 1 đổi 1 sang thỏi mới nguyên seal hoàn toàn miễn phí ship 2 chiều** trong vòng 24 giờ cho Chị. Chị chụp giúp em mã Batch Code dưới đáy hộp kèm ảnh tình trạng sản phẩm gửi qua đây, hoặc gọi Hotline **1900-6868** để em cử shipper VIP qua đổi mới và hỗ trợ Chị ngay trong hôm nay nhé ạ!

