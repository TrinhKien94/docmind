# --- Kịch bản 5: GENERAL (Tư vấn Tổng hợp Mua hàng & Dịch vụ) ---
docmind.customer-support.scenarios.GENERAL.title=Tư vấn Tổng hợp Mua hàng & Dịch vụ
docmind.customer-support.scenarios.GENERAL.description=Tư vấn toàn diện cho khách hàng đang tìm hiểu mua sản phẩm hoặc đang sử dụng dịch vụ.
docmind.customer-support.scenarios.GENERAL.playbook-instructions=- Khách hàng đang cần TƯ VẤN TỔNG HỢP về sản phẩm, dịch vụ hoặc chính sách chăm sóc khách hàng.\n- Nhận diện chính xác mục đích của khách hàng (mua sản phẩm mới hay sử dụng dịch vụ) để giải đáp trực diện, đầy đủ.\n- Giữ phong thái lịch sự, tận tâm, chuyên nghiệp và chủ động gợi mở bước hỗ trợ tiếp theo.
docmind.customer-support.scenarios.GENERAL.default-evolution-guideline=Luôn xác định nhanh mục đích mua sản phẩm mới hay hỗ trợ dịch vụ đang dùng để cá nhân hoá câu trả lời và cung cấp Hotline/Email hỗ trợ khi cần.
docmind.customer-support.scenarios.GENERAL.suggested-questions[0]=Tư vấn giúp tôi các sản phẩm và gói dịch vụ nổi bật hiện nay?
